<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 타로</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg-deep: #120d24;
  --bg-mid: #1d1538;
  --gold: #d9b45b;
  --gold-soft: #b89a55;
  --parchment: #efe6d2;
  --violet-mist: #8a7bb5;
  --card-back-1: #2a1f4e;
  --card-back-2: #1a1238;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  font-family: "Gowun Batang", serif;
  background:
    radial-gradient(ellipse at 50% -10%, #2c2152 0%, transparent 55%),
    radial-gradient(ellipse at 80% 110%, #251a45 0%, transparent 50%),
    var(--bg-deep);
  color: var(--parchment);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  min-height: 100vh;
  padding: 24px 12px;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.stars span {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: var(--parchment);
  opacity: .35;
  animation: twinkle 3.6s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: .12; transform: scale(.8); }
  50% { opacity: .55; transform: scale(1.15); }
}

.stage {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 720px;
  text-align: center;
}

.screen { display: none; animation: fade-in .6s ease both; }
.screen.active { display: block; }

@keyframes fade-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.intro-title {
  font-family: "Cinzel", "Gowun Batang", serif;
  font-size: clamp(28px, 6vw, 44px);
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--gold);
  margin-bottom: 14px;
}

.intro-sub {
  font-size: clamp(14px, 3vw, 17px);
  color: var(--violet-mist);
  margin-bottom: 42px;
  letter-spacing: .04em;
}

.ornament {
  color: var(--gold-soft);
  font-size: 18px;
  letter-spacing: .5em;
  margin-bottom: 28px;
  opacity: .8;
}

.btn {
  font-family: "Gowun Batang", serif;
  font-size: 17px;
  letter-spacing: .14em;
  color: var(--gold);
  background: transparent;
  border: 1px solid var(--gold-soft);
  border-radius: 999px;
  padding: 15px 46px;
  cursor: pointer;
  transition: background .25s, color .25s, box-shadow .25s, transform .15s;
}

.btn:hover,
.btn:focus-visible {
  background: var(--gold);
  color: var(--bg-deep);
  box-shadow: 0 0 28px rgba(217, 180, 91, .35);
  outline: none;
}

.btn:active { transform: scale(.97); }

.pick-guide {
  font-size: clamp(14px, 3vw, 17px);
  color: var(--parchment);
  margin-bottom: 36px;
  letter-spacing: .05em;
}

.deck {
  position: relative;
  height: 230px;
  margin: 0 auto;
  max-width: 640px;
}

.card {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 92px;
  height: 150px;
  margin-left: -46px;
  transform-origin: 50% 130%;
  cursor: pointer;
  border: none;
  background: transparent;
  padding: 0;
  transition: transform .35s cubic-bezier(.22, .9, .3, 1.2), filter .25s;
}

.card-face {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border: 1px solid rgba(217, 180, 91, .55);
  border-radius: 9px;
  background:
    radial-gradient(circle at 50% 32%, rgba(217, 180, 91, .18) 0%, transparent 42%),
    linear-gradient(160deg, var(--card-back-1), var(--card-back-2));
  box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
}

.card-face::before {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(217, 180, 91, .3);
  border-radius: 6px;
}

.card-face::after {
  content: "✶";
  font-size: 26px;
  color: var(--gold-soft);
  opacity: .9;
  text-shadow: 0 0 12px rgba(217, 180, 91, .5);
}

.card-face.has-card-back {
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}

.card-face.has-card-back::before,
.card-face.has-card-back::after {
  display: none;
}

.card:hover,
.card:focus-visible {
  z-index: 50;
  filter: brightness(1.25) drop-shadow(0 0 14px rgba(217, 180, 91, .45));
  outline: none;
}

@keyframes shuffle-jiggle {
  0% { transform: translateX(0) rotate(0deg); }
  25% { transform: translateX(-60px) rotate(-8deg); }
  50% { transform: translateX(40px) rotate(6deg); }
  75% { transform: translateX(-20px) rotate(-3deg); }
  100% { transform: translateX(0) rotate(0deg); }
}

.deck.shuffling .card { animation: shuffle-jiggle .55s ease-in-out; }

.result-card {
  width: min(280px, 72vw);
  margin: 0 auto 26px;
  perspective: 1200px;
}

.result-inner {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 5;
  transform-style: preserve-3d;
  animation: flip-reveal .9s cubic-bezier(.3, .7, .3, 1) both;
}

@keyframes flip-reveal {
  from { transform: rotateY(180deg); }
  to { transform: rotateY(0deg); }
}

.result-front,
.result-back {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 14px;
  backface-visibility: hidden;
}

.result-back.has-card-back {
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}

.result-back {
  transform: rotateY(180deg);
  border: 1px solid rgba(217, 180, 91, .55);
  background: linear-gradient(160deg, var(--card-back-1), var(--card-back-2));
}

.result-front {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--gold-soft);
  background: linear-gradient(170deg, #241a45, #150f2e);
  box-shadow: 0 14px 44px rgba(0, 0, 0, .55), 0 0 40px rgba(217, 180, 91, .12);
}

.result-front img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  width: 100%;
  height: 100%;
  padding: 20px;
}

.placeholder .ph-symbol {
  font-size: 44px;
  color: var(--gold);
  text-shadow: 0 0 22px rgba(217, 180, 91, .6);
}

.placeholder .ph-name {
  font-family: "Cinzel", "Gowun Batang", serif;
  font-size: 17px;
  line-height: 1.6;
  letter-spacing: .08em;
  color: var(--parchment);
}

.placeholder .ph-line {
  width: 46px;
  height: 1px;
  background: var(--gold-soft);
}

.result-name {
  font-family: "Cinzel", "Gowun Batang", serif;
  font-size: clamp(19px, 4.4vw, 25px);
  letter-spacing: .08em;
  color: var(--gold);
  margin-bottom: 16px;
}

.result-desc {
  max-width: 460px;
  margin: 0 auto 36px;
  padding: 0 8px;
  font-size: clamp(14px, 3.4vw, 16.5px);
  line-height: 1.9;
  color: var(--parchment);
  word-break: keep-all;
  white-space: pre-line;
}

.result-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.result-actions .btn {
  padding: 13px 20px;
  font-size: 15px;
  letter-spacing: .06em;
}

.handwriting-modal {
  position: fixed;
  z-index: 10;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background: rgba(7, 4, 15, .78);
}

.handwriting-modal[hidden] {
  display: none;
}

.handwriting-modal__panel {
  position: relative;
  width: 100%;
  max-width: 430px;
  max-height: min(760px, 88vh);
  padding: 42px 14px 14px;
  overflow: auto;
  border: 1px solid rgba(217, 180, 91, .5);
  border-radius: 16px;
  background: #fffdf7;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
}

.handwriting-modal__title {
  margin-bottom: 10px;
  text-align: center;
  color: #5b4432;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .08em;
}

.handwriting-modal__close {
  position: absolute;
  top: 8px;
  right: 10px;
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 50%;
  color: #5b4432;
  background: transparent;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
}

.handwriting-modal__close:hover,
.handwriting-modal__close:focus-visible {
  background: rgba(91, 68, 50, .1);
  outline: none;
}

.handwriting-modal__image {
  display: block;
  width: 100%;
  max-height: min(660px, 72vh);
  object-fit: contain;
}

body.modal-open { overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  .result-inner,
  .deck.shuffling .card,
  .screen,
  .stars span { animation: none !important; }
}

@media (max-width: 480px) {
  .deck { height: 190px; }
  .card { width: 70px; height: 116px; margin-left: -35px; }
}

</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <main class="stage">
    <section class="screen active" id="screen-intro" aria-labelledby="intro-title">
      <div class="ornament" aria-hidden="true">✦ ✦ ✦</div>
      <h1 class="intro-title" id="intro-title"></h1>
      <p class="intro-sub" id="intro-sub"></p>
      <button class="btn" id="btn-start" type="button"></button>
    </section>

    <section class="screen" id="screen-pick" aria-labelledby="pick-guide">
      <p class="pick-guide" id="pick-guide"></p>
      <div class="deck" id="deck" role="group" aria-label="타로 카드 덱"></div>
    </section>

    <section class="screen" id="screen-result" aria-live="polite" aria-labelledby="result-name">
      <div class="result-card">
        <div class="result-inner" id="result-inner">
          <div class="result-front" id="result-front"></div>
          <div class="result-back" aria-hidden="true"></div>
        </div>
      </div>
      <h2 class="result-name" id="result-name"></h2>
      <p class="result-desc" id="result-desc"></p>
      <div class="result-actions">
        <button class="btn" id="btn-retry" type="button"></button>
        <button class="btn" id="btn-handwriting" type="button" hidden>행운의 한마디</button>
      </div>
    </section>
  </main>

  <div class="handwriting-modal" id="handwriting-modal" role="dialog" aria-modal="true" aria-labelledby="handwriting-modal-title" hidden>
    <div class="handwriting-modal__panel">
      <button class="handwriting-modal__close" id="btn-close-handwriting" type="button" aria-label="행운의 한마디 닫기">×</button>
      <p class="handwriting-modal__title" id="handwriting-modal-title">행운의 한마디</p>
      <img class="handwriting-modal__image" id="handwriting-modal-image" alt="">
    </div>
  </div>

  <script>
/*
 * 카드 콘텐츠 설정
 *
 * 카드명과 설명을 수정하거나 새 항목을 추가하면 화면에 바로 반영됩니다.
 * 변경 후 GitHub main 브랜치에 푸시하면 Cloudflare Pages가 자동 배포합니다.
 */

const IMAGE_STORAGE = Object.freeze({
  // 현재는 "local"을 사용합니다. S3 또는 CloudFront로 옮길 때 "remote"로 변경하세요.
  mode: "local",

  // S3 버킷 직접 URL보다 CloudFront 같은 CDN URL 사용을 권장합니다.
  // 예: "https://images.example.com/tarot"
  remoteBaseUrl: ""
});

const CARD_BACK = {
  image: { local: "card12.png", remote: "" }
};

const CARDS = [
  {
    id: "the-tower",
    name: "THE TOWER 탑",
    image: { local: "card01.png", remote: "" },
    handwriting: { local: "yuni.png", remote: "" },
    description: "가까운 사람이 예상치 못한 시련을 줄 수 있습니다.\n그러나 지금의 위기를 두려워하기보다 직시하세요.\n탑이 허물어진 자리에서야\n비로소 진짜 기초를 새로 쌓을 수 있습니다."
  },
  {
    id: "the-hermit",
    name: "THE HERMIT 은둔자",
    image: { local: "card02.png", remote: "" },
    handwriting: { local: "huya.png", remote: "" },
    description: "잠시 멈추고 혼자가 되어보세요.\n지금 당신에게 필요한 답은 밖이 아닌 내면에 있습니다.\n고요함 속에서 지혜를 찾으세요."
  },
  {
    id: "justice",
    name: "JUSTICE 정의",
    image: { local: "card03.png", remote: "" },
    handwriting: { local: "hina.png", remote: "" },
    description: "감정적으로 대처하면 오히려 일을 그르칠 수 있습니다.\n냉철한 판단으로 공정하고 정의로운 선택을 할 때 입니다."
  },
  {
    id: "the-emperor",
    name: "THE EMPEROR 황제",
    image: { local: "card04.png", remote: "" },
    handwriting: { local: "mahiro.png", remote: "" },
    description: "때로는 당당하게 주도권을 쥘 필요가 있습니다.\n스스로의 원칙과 기준을 따르세요."
  },
  {
    id: "the-hierophant",
    name: "THE HIEROPHANT 교황",
    image: { local: "card05.png", remote: "" },
    handwriting: { local: "lize.png", remote: "" },
    description: "당신이 가진 생각을 세상 밖으로 꺼내세요.\n같은 마음을 가진 사람을 반드시 찾을 수 있을거예요."
  },
  {
    id: "the-world",
    name: "THE WORLD 세계",
    image: { local: "card06.png", remote: "" },
    handwriting: { local: "tabi.png", remote: "" },
    description: "지금 겪는 고난은 새로운 한 걸음의 토대가 되는 과정입니다.\n그 끝에서는 놀라운 세계를 마주할 수 있을 거예요."
  },
  {
    id: "the-chariot",
    name: "THE CHARIOT 전차",
    image: { local: "card07.png", remote: "" },
    handwriting: { local: "buki.png", remote: "" },
    description: "망설임 없이 앞으로 날아가세요. 멈추지 않는 추진력과 순간 순간의 판단력이 당신을 떨어지지 않게 도와줄 거예요."
  },
  {
    id: "temperance",
    name: "TEMPERANCE 절제",
    image: { local: "card08.png", remote: "" },
    handwriting: { local: "rin.png", remote: "" },
    description: "본인의 기준은 본인이 세우는 것입니다.\n자신에게 맞는 속도와 기준을 다시 설정해보세요."
  },
  {
    id: "strength",
    name: "STRENGTH 힘",
    image: { local: "card09.png", remote: "" },
    handwriting: { local: "nana.png", remote: "" },
    description: "진정한 카리스마는 화려하게 뽐내지 않아도 자연스레 느껴지는 것, 오늘은 그냥 당신답게 걸어가세요."
  },
  {
    id: "the-fool",
    name: "THE FOOL 바보",
    image: { local: "card10.png", remote: "" },
    handwriting: { local: "riko.png", remote: "" },
    description: "가끔은 너무 많이 아는 것이 근심을 키워\n용기를 내지 못하게 할 때가 있습니다.\n오늘은 걱정보다 일단 그냥 뛰어드는 것이 정답일 수 있어요."
  },
  {
    id: "special-card",
    name: "???????",
    image: { local: "card11.png", remote: "" },
    description: "해가 지고, 밤이 되면 새로운 세상이 펼쳐집니다."
  }
];

const TEXTS = {
  introTitle: "오늘의 스텔라 운세",
  introSub: "스텔라와 함께면, 나쁜 하루는 없어요.",
  startButton: "타로 카드 뽑기",
  pickGuide: "마음이 가는 카드를 한 장 선택해 주세요",
  retryButton: "다시 뽑기"
};


(function () {
  "use strict";

  const imageStorage = IMAGE_STORAGE;
  const cardBack = CARD_BACK;
  const elements = {
    title: document.getElementById("intro-title"),
    subtitle: document.getElementById("intro-sub"),
    startButton: document.getElementById("btn-start"),
    pickGuide: document.getElementById("pick-guide"),
    retryButton: document.getElementById("btn-retry"),
    handwritingButton: document.getElementById("btn-handwriting"),
    handwritingModal: document.getElementById("handwriting-modal"),
    handwritingModalImage: document.getElementById("handwriting-modal-image"),
    closeHandwritingButton: document.getElementById("btn-close-handwriting"),
    stars: document.getElementById("stars"),
    deck: document.getElementById("deck"),
    resultFront: document.getElementById("result-front"),
    resultBack: document.querySelector(".result-back"),
    resultInner: document.getElementById("result-inner"),
    resultName: document.getElementById("result-name"),
    resultDescription: document.getElementById("result-desc")
  };

  const screens = {
    intro: document.getElementById("screen-intro"),
    pick: document.getElementById("screen-pick"),
    result: document.getElementById("screen-result")
  };

  let shuffledCards = [];
  let currentHandwriting = null;

  applyTexts();
  applyCardBack();
  renderStars();
  bindEvents();

  function applyTexts() {
    elements.title.textContent = TEXTS.introTitle;
    elements.subtitle.textContent = TEXTS.introSub;
    elements.startButton.textContent = TEXTS.startButton;
    elements.pickGuide.textContent = TEXTS.pickGuide;
    elements.retryButton.textContent = TEXTS.retryButton;
  }

  function renderStars() {
    for (let index = 0; index < 36; index += 1) {
      const star = document.createElement("span");
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.animationDelay = `${(Math.random() * 3.6).toFixed(2)}s`;
      elements.stars.appendChild(star);
    }
  }

  function bindEvents() {
    elements.startButton.addEventListener("click", startDraw);
    elements.retryButton.addEventListener("click", startDraw);
    elements.handwritingButton.addEventListener("click", openHandwritingModal);
    elements.closeHandwritingButton.addEventListener("click", closeHandwritingModal);
    elements.handwritingModal.addEventListener("click", (event) => {
      if (event.target === elements.handwritingModal) closeHandwritingModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !elements.handwritingModal.hidden) closeHandwritingModal();
    });
  }

  function startDraw() {
    shuffledCards = shuffle(CARDS);
    renderDeck();
    showScreen("pick");

    elements.deck.classList.remove("shuffling");
    void elements.deck.offsetWidth;
    elements.deck.classList.add("shuffling");
    window.setTimeout(() => elements.deck.classList.remove("shuffling"), 600);
  }

  function shuffle(cards) {
    const result = cards.slice();
    for (let index = result.length - 1; index > 0; index -= 1) {
      const randomIndex = Math.floor(Math.random() * (index + 1));
      [result[index], result[randomIndex]] = [result[randomIndex], result[index]];
    }
    return result;
  }

  function renderDeck() {
    elements.deck.replaceChildren();
    const total = shuffledCards.length;
    const spread = Math.min(64, total * 7);
    const cardBackUrl = resolveImageUrl(cardBack.image);

    shuffledCards.forEach((card, index) => {
      const angle = total === 1 ? 0 : -spread / 2 + (spread / (total - 1)) * index;
      const button = document.createElement("button");
      const cardFace = document.createElement("span");

      button.className = "card";
      button.type = "button";
      button.style.transform = `rotate(${angle}deg)`;
      button.setAttribute("aria-label", `${card.name} 선택`);
      cardFace.className = "card-face";
      if (cardBackUrl) {
        cardFace.classList.add("has-card-back");
        cardFace.style.backgroundImage = `url("${cardBackUrl}")`;
      }
      button.appendChild(cardFace);
      button.addEventListener("click", () => revealCard(card));
      elements.deck.appendChild(button);
    });
  }

  function revealCard(card) {
    elements.resultFront.replaceChildren();
    const imageUrl = resolveImageUrl(card.image);

    if (imageUrl) {
      const image = document.createElement("img");
      image.src = imageUrl;
      image.alt = card.name;
      image.addEventListener("error", () => showPlaceholder(card.name), { once: true });
      elements.resultFront.appendChild(image);
    } else {
      showPlaceholder(card.name);
    }

    elements.resultName.textContent = card.name;
    elements.resultDescription.textContent = card.description;
    prepareHandwriting(card);
    restartRevealAnimation();
    showScreen("result");
  }

  function applyCardBack() {
    const imageUrl = resolveImageUrl(cardBack.image);
    if (!imageUrl) return;

    elements.resultBack.classList.add("has-card-back");
    elements.resultBack.style.backgroundImage = `url("${imageUrl}")`;
  }

  function prepareHandwriting(card) {
    const imageUrl = resolveImageUrl(card.handwriting, "assets/handwriting");
    closeHandwritingModal();
    currentHandwriting = imageUrl ? {
      url: imageUrl,
      alt: `${card.name} 캐릭터의 손글씨`
    } : null;
    elements.handwritingButton.hidden = !currentHandwriting;
  }

  function openHandwritingModal() {
    if (!currentHandwriting) return;

    elements.handwritingModalImage.src = currentHandwriting.url;
    elements.handwritingModalImage.alt = currentHandwriting.alt;
    elements.handwritingModal.hidden = false;
    document.body.classList.add("modal-open");
    elements.closeHandwritingButton.focus();
  }

  function closeHandwritingModal() {
    if (elements.handwritingModal.hidden) return;

    elements.handwritingModal.hidden = true;
    document.body.classList.remove("modal-open");
  }

  function resolveImageUrl(image, localBasePath = "assets/cards") {
    const source = image || {};

    if (imageStorage.mode === "remote" && source.remote) {
      if (isAbsoluteUrl(source.remote)) return source.remote;
      if (imageStorage.remoteBaseUrl) {
        return `${imageStorage.remoteBaseUrl.replace(/\/$/, "")}/${source.remote.replace(/^\//, "")}`;
      }
    }

    return source.local ? `${localBasePath}/${source.local.replace(/^\//, "")}` : "";
  }

  function isAbsoluteUrl(value) {
    return /^https?:\/\//i.test(value);
  }

  function showPlaceholder(name) {
    const placeholder = document.createElement("div");
    const symbol = document.createElement("span");
    const line = document.createElement("span");
    const cardName = document.createElement("span");

    placeholder.className = "placeholder";
    symbol.className = "ph-symbol";
    line.className = "ph-line";
    cardName.className = "ph-name";
    symbol.textContent = "✶";
    cardName.textContent = name;
    placeholder.append(symbol, line, cardName);
    elements.resultFront.replaceChildren(placeholder);
  }

  function restartRevealAnimation() {
    elements.resultInner.style.animation = "none";
    void elements.resultInner.offsetWidth;
    elements.resultInner.style.animation = "";
  }

  function showScreen(name) {
    Object.values(screens).forEach((screen) => screen.classList.remove("active"));
    screens[name].classList.add("active");
  }
})();

  </script>
</body>
</html>
